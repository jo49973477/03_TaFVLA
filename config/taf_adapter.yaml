defaults:
  - taf_adapter_schema
  - _self_

# TaF-Adapter reproduction config.
# Except for window_size=5 and the Eq. (1)--(11) structure, numeric values below
# are initial experimental choices because the paper does not publish them.

data:
  root_dir: null
  window_size: 5                 # The paper reports N=5.
  stride: 1
  image_size: [224, 224]
  max_sequences: null
  sensor_types: null
  split_seed: 42
  split_unit: "sequence"         # "sequence" or "episode"; never split windows.
  validation_fraction: 0.1
  skip_invalid_sequences: false  # Training refuses silently skipped sequences.
  timestamp_cache_enabled: true
  # null -> ${XDG_CACHE_HOME:-~/.cache}/taf-vla/video_timestamps/
  timestamp_cache_dir: null
  show_initialization_progress: true
  alignment_decode_windows_per_episode: 1
  normalization_eps: 1.0e-6
  normalization_chunk_frames: 8192

force_encoder:
  hidden_dim: 512
  pressure_latent_dim: 128
  force_latent_dim: 128
  mlp_layers: 2

vq:
  pressure_codebook_size: 512
  force_codebook_size: 512
  commitment_beta: 0.25

tactile_encoder:
  # Verified in the installed timm 1.0.30 registry. AugReg ImageNet-21k
  # pretraining followed by ImageNet-1k fine-tuning; exact backbone/init/freeze
  # choices are not disclosed by TaF-VLA.
  backbone: "vit_small_patch16_224.augreg_in21k_ft_in1k"
  pretrained: true
  freeze_backbone: true
  transformer_dim: 256
  transformer_layers: 2
  num_heads: 4
  dropout: 0.1
  max_window_size: 20

loss:
  lambda_quant: 1.0
  lambda_recon: 1.0
  temperature: 0.07
  # "paper" implements Eq. (10), tactile->force only. "symmetric" averages
  # tactile->force and force->tactile, matching the prose description.
  nce_mode: "paper"

training:
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.00001
  max_steps: 10000
  num_workers: 4
  seed: 42
  amp: true
  grad_clip_norm: 1.0
  # TTY: fixed-position tqdm dashboard; non-TTY: periodic plain-text summary.
  log_every: 20
  validate_every: 500
  validation_batches: 50
  save_every: 1000
  output_dir: "outputs/taf_adapter"
  resume: null
  # Gradient accumulation does not increase the number of InfoNCE negatives.
  min_same_episode_window_gap: 5

wandb:
  enabled: false
  project: "TaF-Adapter"
  entity: null
  name: null
  group: null
  tags: ["taf-vla", "pretraining"]
  mode: "online"
  # Native scalar histories use global_step; README explains overlay panels.
  # W&B keeps only pressure/force perplexity for codebook diversity, while
  # metrics.jsonl retains every codebook diagnostic.
  log_every: 20
  watch_model: false

alignment_eval:
  enabled: true
  retrieval_every_n_epochs: 1
  visualize_every_n_epochs: 5
  retrieval_max_pairs: 256
  visualization_max_pairs: 64
  # 실제 적용 간격은 temporal overlap 방지를 위해 max(이 값, window_size)이다.
  min_window_start_gap: 5
  random_seed: 42
  run_on_training_end: true
  save_local_figures: true

check:
  overfit_steps: 100
  skip_overfit: false
  no_pretrained: false
  # Keep T=5 last so its model can be reused by the synthetic overfit check.
  window_sizes: [1, 3, 10, 5]

hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
